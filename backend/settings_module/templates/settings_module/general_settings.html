{% extends "base/superadmin_base.html" %}
{% load static %}

{% block content %}

<div class="settings-container">

    <!-- Tabs -->
    <div class="settings-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'general')">General</button>
        <button class="tab-btn" onclick="openTab(event, 'seo')">SEO</button>
        <button class="tab-btn" onclick="openTab(event, 'appearance')">Appearance</button>
        
        <button class="tab-btn" onclick="openTab(event, 'payment')">Payment</button>
    </div>

    <!-- ================= GENERAL ================= -->
    <div id="general" class="tab-content active">
        <h3>General Settings</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Site Name</label>
                    <input type="text" name="site_name" value="{{ setting.site_name }}">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ setting.email }}">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ setting.phone }}">
                </div>

                <div class="form-group">
                    <label>Timezone</label>
                    <input type="text" name="timezone" value="{{ setting.timezone }}">
                </div>

            </div>

            <button type="submit" name="general_submit" class="save-btn">
                Save Settings
            </button>

        </form>
    </div>

    <!-- ================= SEO ================= -->
    <div id="seo" class="tab-content">
        <h3>SEO Settings</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Meta Title</label>
                    <input type="text" name="meta_title" value="{{ setting.meta_title }}">
                </div>

                <div class="form-group full-width">
                    <label>Meta Description</label>
                    <textarea name="meta_description">{{ setting.meta_description }}</textarea>
                </div>

            </div>

            <button type="submit" name="seo_submit" class="save-btn">
                Save SEO
            </button>

        </form>
    </div>

    <!-- ================= APPEARANCE ================= -->
    <div id="appearance" class="tab-content">
        <h3>Appearance Settings</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Primary Color</label>
                <input type="color" name="primary_color" value="{{ setting.primary_color }}">
            </div>

            <button type="submit" name="appearance_submit" class="save-btn">
                Save Appearance
            </button>

        </form>
    </div>

    
<!-- ================= PAYMENT ================= -->
<div id="payment" class="tab-content">
    <h3>Payment Settings (Razorpay)</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Razorpay Key ID</label>
                <input type="text" name="razorpay_key_id" value="{{ setting.razorpay_key_id }}">
            </div>

            <div class="form-group">
                <label>Razorpay Key Secret</label>
                <input type="password" name="razorpay_key_secret" value="{{ setting.razorpay_key_secret }}">
            </div>

        </div>

        <button type="submit" name="payment_submit" class="save-btn">
            Save Payment Settings
        </button>

    </form>
</div>
</div>

<script>
function openTab(evt, tabName) {
    document.querySelectorAll(".tab-content").forEach(function(tab) {
        tab.style.display = "none";
    });

    document.querySelectorAll(".tab-btn").forEach(function(btn) {
        btn.classList.remove("active");
    });

    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.classList.add("active");
}

document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll(".tab-content").forEach(function(tab) {
        tab.style.display = "none";
    });
    document.getElementById("general").style.display = "block";
});
</script>

{% endblock %}
